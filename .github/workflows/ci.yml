name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  model-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Docs are in sync with the model
        run: |
          python scripts/build_docs.py
          git diff --exit-code docs/measures.md docs/data_model.md
